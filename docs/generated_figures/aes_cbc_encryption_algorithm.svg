<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="0b3f98Arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b3f98"/></marker>
<marker id="15915cArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15915c"/></marker>
<marker id="f28c22Arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f28c22"/></marker>
<marker id="7137d8Arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7137d8"/></marker>
</defs>
<rect width="1600" height="900" fill="#f7f9fd"/>
<text x="70" y="82" text-anchor="start" font-family="Arial" font-size="54" font-weight="700" fill="#0b3f98">AES-128-CBC Encryption Algorithm</text>
<text x="72" y="124" text-anchor="start" font-family="Arial" font-size="27" font-weight="400" fill="#111827">Each plaintext block is XORed with IV or previous ciphertext before AES encryption.</text>
<rect x="0" y="145" width="1600" height="8" fill="#0b3f98"/>
<rect x="105" y="305" width="170" height="90" rx="10" fill="#eaf2ff" stroke="#3b7cff" stroke-width="3"/>
<text x="190.0" y="343.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Plaintext</text>
<text x="190.0" y="371.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">P_i</text>
<circle cx="430" cy="350" r="38" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<line x1="402" y1="350" x2="458" y2="350" stroke="#111827" stroke-width="3"/>
<line x1="430" y1="322" x2="430" y2="378" stroke="#111827" stroke-width="3"/>
<text x="478" y="359" text-anchor="start" font-family="Arial" font-size="25" font-weight="700" fill="#111827">XOR</text>
<rect x="560" y="300" width="220" height="100" rx="10" fill="#fff4df" stroke="#f28c22" stroke-width="3"/>
<text x="670.0" y="343.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">AES-128</text>
<text x="670.0" y="371.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Encrypt</text>
<rect x="930" y="305" width="170" height="90" rx="10" fill="#f0e8ff" stroke="#7137d8" stroke-width="3"/>
<text x="1015.0" y="343.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Ciphertext</text>
<text x="1015.0" y="371.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">C_i</text>
<line x1="275" y1="350" x2="392" y2="350" stroke="#0b3f98" stroke-width="5" marker-end="url(#0b3f98Arrow)"/>
<line x1="468" y1="350" x2="560" y2="350" stroke="#0b3f98" stroke-width="5" marker-end="url(#0b3f98Arrow)"/>
<line x1="780" y1="350" x2="930" y2="350" stroke="#0b3f98" stroke-width="5" marker-end="url(#0b3f98Arrow)"/>
<rect x="565" y="188" width="210" height="62" rx="10" fill="#ffffff" stroke="#c7d3e6" stroke-width="3"/>
<text x="670.0" y="212.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Secret key K</text>
<line x1="670" y1="250" x2="670" y2="298" stroke="#f28c22" stroke-width="5" marker-end="url(#f28c22Arrow)"/>
<rect x="318" y="188" width="224" height="62" rx="10" fill="#ecfff5" stroke="#15915c" stroke-width="3"/>
<text x="430.0" y="212.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">C_0 = IV</text>
<text x="430.0" y="240.0" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#111827">C_{i-1} for i &gt; 1</text>
<line x1="430" y1="250" x2="430" y2="312" stroke="#15915c" stroke-width="5" marker-end="url(#15915cArrow)"/>
<polyline points="1015,395 1015,485 430,485 430,389" fill="none" stroke="#7137d8" stroke-width="5" marker-end="url(#7137d8Arrow)"/>
<text x="710" y="512" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#5f6f89">feedback to next block</text>
<rect x="120" y="585" width="820" height="205" rx="8" fill="#ffffff" stroke="#c7d3e6" stroke-width="2"/>
<text x="145" y="648" text-anchor="start" font-family="Arial" font-size="30" font-weight="700" fill="#0b3f98">Block-by-block operation</text>
<text x="150" y="703" text-anchor="start" font-family="Arial" font-size="25" font-weight="400" fill="#111827">1. Select feedback value: IV for first block, otherwise C_{i-1}.</text>
<text x="150" y="743" text-anchor="start" font-family="Arial" font-size="25" font-weight="400" fill="#111827">2. XOR feedback with plaintext block P_i.</text>
<text x="150" y="783" text-anchor="start" font-family="Arial" font-size="25" font-weight="400" fill="#111827">3. AES encrypt the XOR result to produce C_i.</text>
<rect x="1050" y="595" width="460" height="195" rx="8" fill="#ffffff" stroke="#c7d3e6" stroke-width="2"/>
<rect x="1050" y="595" width="460" height="47" fill="#0b3f98"/>
<text x="1075" y="628" text-anchor="start" font-family="Arial" font-size="30" font-weight="700" fill="#ffffff">CBC formula</text>
<text x="1080" y="692" text-anchor="start" font-family="Consolas" font-size="25" font-weight="700" fill="#111827">C_1 = E_K(P_1 xor IV)</text>
<text x="1080" y="737" text-anchor="start" font-family="Consolas" font-size="25" font-weight="700" fill="#111827">C_i = E_K(P_i xor C_{i-1})</text>
<text x="1080" y="782" text-anchor="start" font-family="Consolas" font-size="25" font-weight="700" fill="#111827">i = 2, 3, ..., n</text>
<rect x="70" y="825" width="1460" height="43" fill="#eaf2ff" stroke="#3b7cff" stroke-width="2"/>
<text x="800" y="856" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0b3f98">Encryption chains blocks: changing one ciphertext block changes the feedback for the next block.</text>
</svg>