<text x="1330" y="613" text-anchor="start" font-family="Arial" font-size="25" font-weight="400" fill="#111827">cyclic row shifts in the 4 x 4 state</text>
<text x="1330" y="644" text-anchor="start" font-family="Arial" font-size="25" font-weight="700" fill="#0b3f98">MixColumns</text>
<text x="1330" y="675" text-anchor="start" font-family="Arial" font-size="25" font-weight="400" fill="#111827">column mixing over GF(2^8)</text>
