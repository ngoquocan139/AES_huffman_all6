<text x="1360" y="805" text-anchor="start" font-family="Arial" font-size="27" font-weight="700" fill="#0b3f98">CBC formula</text>
<text x="1360" y="850" text-anchor="start" font-family="Arial" font-size="24" font-weight="700" fill="#111827">C_1 = E_K(P_1 xor IV)</text>
<text x="1360" y="879" text-anchor="start" font-family="Arial" font-size="24" font-weight="700" fill="#111827">C_i = E_K(P_i xor C_{i-1})</text>
