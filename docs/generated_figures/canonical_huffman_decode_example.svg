<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0b2f89; }
      .h2 { font: 700 24px Arial, sans-serif; fill: #0b2f89; }
      .txt { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .mono { font: 20px Consolas, monospace; fill: #111827; }
      .monoSmall { font: 16px Consolas, monospace; fill: #111827; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; rx: 10; }
      .blueBox { fill: #e8f0ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .greenBox { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .orangeBox { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 10; }
      .grayBox { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; rx: 10; }
      .bitE { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .bitD { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .bitL { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .bitU { fill: #fae8ff; stroke: #a21caf; stroke-width: 2; rx: 8; }
      .bitC { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .bitM { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 8; }
      .bitK { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .bitZ { fill: #f1f5f9; stroke: #475569; stroke-width: 2; rx: 8; }
      .arrow { stroke: #0b2f89; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .thinArrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrowHeadGray); }
      .divider { stroke: #d1d5db; stroke-width: 2; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0b2f89" />
    </marker>
    <marker id="arrowHeadGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="950" fill="#f8fafc"/>
  <text x="52" y="62" class="title">Canonical Huffman Decode Example</text>
  <text x="52" y="96" class="txt">The RX side does not store the original tree. It reads code lengths, rebuilds the canonical code table, then matches payload bits.</text>

  <!-- Step 1 -->
  <rect x="50" y="135" width="380" height="420" class="blueBox"/>
  <text x="78" y="178" class="h2">1. Header gives code length</text>
  <text x="78" y="215" class="txt">From the compressed block header:</text>
  <line x1="88" y1="248" x2="390" y2="248" class="divider"/>
  <text x="95" y="276" class="monoSmall">Symbol</text>
  <text x="230" y="276" class="monoSmall">Code length</text>
  <line x1="88" y1="292" x2="390" y2="292" class="divider"/>
  <text x="120" y="325" class="mono">E</text><text x="280" y="325" class="mono">1</text>
  <text x="120" y="360" class="mono">D</text><text x="280" y="360" class="mono">3</text>
  <text x="120" y="395" class="mono">L</text><text x="280" y="395" class="mono">3</text>
  <text x="120" y="430" class="mono">U</text><text x="280" y="430" class="mono">3</text>
  <text x="120" y="465" class="mono">C</text><text x="280" y="465" class="mono">4</text>
  <text x="120" y="500" class="mono">M</text><text x="280" y="500" class="mono">5</text>
  <text x="120" y="535" class="mono">K, Z</text><text x="280" y="535" class="mono">6</text>

  <!-- Step 2 -->
  <path d="M450 345 L535 345" class="arrow"/>
  <rect x="560" y="135" width="430" height="420" class="greenBox"/>
  <text x="590" y="178" class="h2">2. Rebuild canonical table</text>
  <text x="590" y="215" class="txt">Sort by length, then by symbol value.</text>
  <line x1="600" y1="248" x2="950" y2="248" class="divider"/>
  <text x="610" y="276" class="monoSmall">Order</text>
  <text x="715" y="276" class="monoSmall">Symbol</text>
  <text x="825" y="276" class="monoSmall">Code</text>
  <line x1="600" y1="292" x2="950" y2="292" class="divider"/>
  <text x="628" y="325" class="mono">1</text><text x="742" y="325" class="mono">E</text><text x="830" y="325" class="mono">0</text>
  <text x="628" y="360" class="mono">2</text><text x="742" y="360" class="mono">D</text><text x="830" y="360" class="mono">100</text>
  <text x="628" y="395" class="mono">3</text><text x="742" y="395" class="mono">L</text><text x="830" y="395" class="mono">101</text>
  <text x="628" y="430" class="mono">4</text><text x="742" y="430" class="mono">U</text><text x="830" y="430" class="mono">110</text>
  <text x="628" y="465" class="mono">5</text><text x="742" y="465" class="mono">C</text><text x="830" y="465" class="mono">1110</text>
  <text x="628" y="500" class="mono">6</text><text x="742" y="500" class="mono">M</text><text x="830" y="500" class="mono">11110</text>
  <text x="628" y="535" class="mono">7</text><text x="742" y="535" class="mono">K</text><text x="830" y="535" class="mono">111110</text>

  <!-- Step 3 -->
  <path d="M1010 345 L1095 345" class="arrow"/>
  <rect x="1120" y="135" width="430" height="420" class="orangeBox"/>
  <text x="1150" y="178" class="h2">3. Decode by prefix match</text>
  <text x="1150" y="215" class="txt">Look at the first bits, find a match,</text>
  <text x="1150" y="242" class="txt">then consume that code length.</text>
  <rect x="1160" y="285" width="330" height="72" class="grayBox"/>
  <text x="1185" y="313" class="small">Input window</text>
  <text x="1185" y="342" class="mono">100101110...</text>
  <path d="M1260 370 L1260 410" class="thinArrow"/>
  <rect x="1160" y="420" width="330" height="72" class="bitD"/>
  <text x="1185" y="448" class="small">First matched prefix</text>
  <text x="1185" y="477" class="mono">100 = D, len = 3</text>
  <text x="1160" y="525" class="txt">Discard 3 bits, continue with next bits.</text>

  <!-- Bottom payload strip -->
  <rect x="50" y="615" width="1500" height="275" class="box"/>
  <text x="78" y="657" class="h2">Payload bitstream is decoded one codeword at a time</text>
  <text x="78" y="692" class="txt">Example compressed payload:</text>

  <rect x="80" y="725" width="100" height="68" class="bitE"/>
  <text x="110" y="754" class="mono">0</text>
  <text x="120" y="780" class="small">E</text>

  <rect x="195" y="725" width="130" height="68" class="bitD"/>
  <text x="220" y="754" class="mono">100</text>
  <text x="250" y="780" class="small">D</text>

  <rect x="340" y="725" width="130" height="68" class="bitL"/>
  <text x="365" y="754" class="mono">101</text>
  <text x="395" y="780" class="small">L</text>

  <rect x="485" y="725" width="130" height="68" class="bitU"/>
  <text x="510" y="754" class="mono">110</text>
  <text x="540" y="780" class="small">U</text>

  <rect x="630" y="725" width="150" height="68" class="bitC"/>
  <text x="655" y="754" class="mono">1110</text>
  <text x="695" y="780" class="small">C</text>

  <rect x="795" y="725" width="175" height="68" class="bitM"/>
  <text x="820" y="754" class="mono">11110</text>
  <text x="875" y="780" class="small">M</text>

  <rect x="985" y="725" width="200" height="68" class="bitK"/>
  <text x="1010" y="754" class="mono">111110</text>
  <text x="1075" y="780" class="small">K</text>

  <rect x="1200" y="725" width="200" height="68" class="bitZ"/>
  <text x="1225" y="754" class="mono">111111</text>
  <text x="1290" y="780" class="small">Z</text>

  <path d="M130 810 L130 840" class="thinArrow"/>
  <path d="M260 810 L260 840" class="thinArrow"/>
  <path d="M405 810 L405 840" class="thinArrow"/>
  <path d="M550 810 L550 840" class="thinArrow"/>
  <path d="M705 810 L705 840" class="thinArrow"/>
  <path d="M882 810 L882 840" class="thinArrow"/>
  <path d="M1085 810 L1085 840" class="thinArrow"/>
  <path d="M1300 810 L1300 840" class="thinArrow"/>

  <text x="78" y="870" class="txt">Decoded output:</text>
  <text x="235" y="872" class="mono">E   D   L   U   C   M   K   Z</text>

  <rect x="1080" y="602" width="430" height="42" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
  <text x="1100" y="629" class="small">RTL idea: table returns {symbol, code_len}; decoder consumes code_len bits.</text>
</svg>
