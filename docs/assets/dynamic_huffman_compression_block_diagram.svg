<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 34px Arial, sans-serif; fill: #111111; }
      .subtitle { font: 16px Arial, sans-serif; fill: #444444; }
      .boundary { fill: #ffffff; stroke: #666666; stroke-width: 2.2; stroke-dasharray: 10 8; }
      .panel { fill: #f7f9fc; stroke: #2f65cc; stroke-width: 2.4; stroke-dasharray: 10 8; }
      .panelOut { fill: #f7fdf8; stroke: #28824a; stroke-width: 2.4; stroke-dasharray: 10 8; }
      .block { fill: #fffaf0; stroke: #202124; stroke-width: 2.2; }
      .blockBlue { fill: #eef6ff; stroke: #202124; stroke-width: 2.2; }
      .blockGreen { fill: #eefaf3; stroke: #202124; stroke-width: 2.2; }
      .blockGray { fill: #f4f4f4; stroke: #202124; stroke-width: 2.2; }
      .subblock { fill: #ffffff; stroke: #505050; stroke-width: 1.6; }
      .legacy { fill: #fbfbfb; stroke: #777777; stroke-width: 2.0; stroke-dasharray: 8 6; }
      .noteBox { fill: #ffffff; stroke: #b7b7b7; stroke-width: 1.4; }
      .label { font: 700 18px Arial, sans-serif; fill: #111111; }
      .subLabel { font: 700 15px Arial, sans-serif; fill: #222222; }
      .text { font: 14px Arial, sans-serif; fill: #222222; }
      .small { font: 13px Arial, sans-serif; fill: #333333; }
      .tiny { font: 12px Arial, sans-serif; fill: #4a4a4a; }
      .note { font: italic 13px Arial, sans-serif; fill: #444444; }
      .wire { fill: none; stroke: #111111; stroke-width: 2.2; }
      .wireData { fill: none; stroke: #265d96; stroke-width: 2.8; }
      .wireCtrl { fill: none; stroke: #6d4c00; stroke-width: 2.6; }
      .wireStatus { fill: none; stroke: #28824a; stroke-width: 2.4; }
      .wireDash { fill: none; stroke: #777777; stroke-width: 2.2; stroke-dasharray: 8 6; }
      .divider { stroke: #c7c7c7; stroke-width: 1.2; }
    </style>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#265d96"/>
    </marker>
    <marker id="arrowCtrl" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d4c00"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#28824a"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#777777"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1900" height="1120"/>

  <text class="title" x="70" y="58">Dynamic Huffman Compression Block Architecture</text>
  <text class="subtitle" x="70" y="86">RTL-derived block diagram for dynamic_huffman_encoder in the whole-file TX path</text>

  <!-- External input panels -->
  <rect class="panel" x="65" y="150" width="250" height="176" rx="10"/>
  <text class="label" x="95" y="184">Clock / Control</text>
  <text class="small" x="95" y="216">clk, rst_n</text>
  <text class="small" x="95" y="240">start_block</text>
  <text class="small" x="95" y="264">whole_file_enable</text>
  <text class="small" x="95" y="288">whole_file_emit_table</text>
  <text class="small" x="95" y="312">whole_file_table_valid</text>

  <rect class="panel" x="65" y="405" width="250" height="188" rx="10"/>
  <text class="label" x="95" y="439">Input Byte Stream</text>
  <text class="small" x="95" y="471">byte_in[7:0]</text>
  <text class="small" x="95" y="495">byte_valid</text>
  <text class="small" x="95" y="519">block_start</text>
  <text class="small" x="95" y="543">block_end</text>
  <line class="divider" x1="95" y1="562" x2="285" y2="562"/>
  <text class="small" x="95" y="584">byte_ready</text>

  <rect class="panel" x="510" y="930" width="780" height="125" rx="10"/>
  <text class="label" x="610" y="964">External Whole-File Canonical Codebook Interface</text>
  <text class="small" x="560" y="1000">ADDR OUT: external_symbol_read_addr, external_code_len_read_index, external_code_read_index</text>
  <text class="small" x="560" y="1026">DATA IN: external_symbol_count, external_symbol_read_data, external_code_len_read_data, external_code_read_data</text>
  <text class="note" x="560" y="1050">Main synthesis path: codebook is built once in huffman_aes_tx_top, then reused by this encoder.</text>

  <!-- Downstream/output panels -->
  <rect class="panelOut" x="1600" y="190" width="240" height="100" rx="10"/>
  <text class="label" x="1642" y="225">Downstream In</text>
  <text class="small" x="1635" y="257">stream_ready</text>

  <rect class="panelOut" x="1600" y="370" width="240" height="152" rx="10"/>
  <text class="label" x="1630" y="405">Compressed Stream Out</text>
  <text class="small" x="1635" y="437">stream_data[31:0]</text>
  <text class="small" x="1635" y="461">stream_len[5:0]</text>
  <text class="small" x="1635" y="485">stream_valid</text>
  <text class="small" x="1635" y="509">stream_last</text>

  <rect class="panelOut" x="1600" y="610" width="240" height="158" rx="10"/>
  <text class="label" x="1650" y="645">Status / Debug</text>
  <text class="small" x="1635" y="677">busy</text>
  <text class="small" x="1635" y="701">done</text>
  <text class="small" x="1635" y="725">error_flag</text>
  <text class="small" x="1635" y="749">selected_mode_out[1:0]</text>
  <text class="small" x="1635" y="773">fsm_state[3:0]</text>

  <rect class="blockGray" x="1600" y="835" width="240" height="92" rx="8"/>
  <text class="label" x="1662" y="870">bit_packer_128</text>
  <text class="small" x="1648" y="900">forms 128-bit words</text>

  <!-- Module boundary -->
  <rect class="boundary" x="355" y="130" width="1185" height="780" rx="14"/>
  <text class="small" x="380" y="165">Module boundary: dynamic_huffman_encoder</text>

  <!-- Control FSM -->
  <rect class="block" x="430" y="205" width="260" height="140" rx="8"/>
  <text class="label" x="505" y="240">control_fsm</text>
  <text class="small" x="458" y="275">phase sequencing</text>
  <text class="small" x="458" y="299">collect / optional build</text>
  <text class="small" x="458" y="323">mode latch / emit</text>

  <!-- Fixed mode latch -->
  <rect class="block" x="815" y="205" width="285" height="112" rx="8"/>
  <text class="label" x="878" y="240">Fixed Mode Latch</text>
  <text class="small" x="850" y="276">selected_mode = COMPRESSED</text>
  <text class="small" x="850" y="300">MODE_COMPRESSED = 2'b10</text>

  <!-- Input collect unit -->
  <rect class="blockGreen" x="430" y="445" width="340" height="218" rx="8"/>
  <text class="label" x="526" y="480">input_collect_unit</text>
  <text class="small" x="462" y="512">byte handshake, block boundary,</text>
  <text class="small" x="462" y="535">local buffer and local histogram</text>
  <rect class="subblock" x="468" y="575" width="118" height="54" rx="4"/>
  <text class="subLabel" x="488" y="598">block_buffer</text>
  <text class="tiny" x="486" y="618">block bytes</text>
  <rect class="subblock" x="612" y="575" width="122" height="54" rx="4"/>
  <text class="subLabel" x="622" y="598">frequency</text>
  <text class="subLabel" x="631" y="616">counter</text>

  <!-- Legacy builder -->
  <rect class="legacy" x="455" y="740" width="285" height="118" rx="6"/>
  <text class="label" x="506" y="775">huffman_builder</text>
  <text class="small" x="487" y="807">legacy / non-synthesis path</text>
  <text class="small" x="487" y="831">local symbol and code tables</text>

  <!-- Codebook mux -->
  <rect class="blockBlue" x="860" y="405" width="325" height="210" rx="8"/>
  <text class="label" x="940" y="440">Codebook MUX</text>
  <text class="small" x="892" y="474">selects external whole-file</text>
  <text class="small" x="892" y="498">canonical codebook in FPGA path</text>
  <line class="divider" x1="892" y1="520" x2="1150" y2="520"/>
  <text class="small" x="892" y="550">symbol_count / symbol</text>
  <text class="small" x="892" y="574">code_len / code</text>

  <!-- Emit backend -->
  <rect class="blockBlue" x="1235" y="365" width="265" height="310" rx="8"/>
  <text class="label" x="1300" y="400">emit_backend</text>
  <text class="small" x="1265" y="430">header + payload emission</text>
  <text class="small" x="1265" y="454">ready/valid stream interface</text>

  <rect class="subblock" x="1268" y="490" width="105" height="66" rx="4"/>
  <text class="subLabel" x="1282" y="516">header</text>
  <text class="subLabel" x="1279" y="536">formatter</text>

  <rect class="subblock" x="1390" y="490" width="84" height="66" rx="4"/>
  <text class="subLabel" x="1404" y="516">payload</text>
  <text class="subLabel" x="1407" y="536">emitter</text>

  <rect class="subblock" x="1308" y="586" width="152" height="58" rx="4"/>
  <text class="subLabel" x="1322" y="610">stream_output</text>
  <text class="subLabel" x="1345" y="630">interface</text>

  <!-- Notes -->
  <rect class="noteBox" x="385" y="875" width="1125" height="22" rx="3"/>
  <text class="note" x="398" y="891">Dashed builder path is retained for non-synthesis compatibility; active FPGA/report path uses the external whole-file canonical codebook.</text>

  <!-- Wires from external panels -->
  <path class="wireCtrl" d="M315 238 L430 238" marker-end="url(#arrowCtrl)"/>
  <text class="tiny" x="330" y="226">clk/rst/control</text>

  <path class="wireData" d="M315 495 L430 495" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="332" y="483">byte stream + flags</text>
  <path class="wireStatus" d="M430 585 L315 585" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="340" y="607">byte_ready</text>

  <!-- Internal control wires -->
  <path class="wireCtrl" d="M560 345 L560 445" marker-end="url(#arrowCtrl)"/>
  <text class="tiny" x="575" y="397">start_collect</text>

  <path class="wireCtrl" d="M690 250 L815 250" marker-end="url(#arrowCtrl)"/>
  <text class="tiny" x="710" y="237">start_mode</text>

  <path class="wireCtrl" d="M1100 260 L1368 260 L1368 365" marker-end="url(#arrowCtrl)"/>
  <text class="tiny" x="1165" y="248">selected_mode</text>

  <path class="wireCtrl" d="M690 322 L760 322 L760 350 L1190 350 L1190 520 L1235 520" marker-end="url(#arrowCtrl)"/>
  <text class="tiny" x="905" y="338">start_emit / phase control</text>

  <!-- Data path wires -->
  <path class="wireData" d="M770 600 L1195 600 L1195 604 L1235 604" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="850" y="586">buffer_read_data</text>

  <path class="wireDash" d="M675 663 L675 740" marker-end="url(#arrowGray)"/>
  <text class="tiny" x="690" y="704">freq_read_count</text>

  <path class="wireDash" d="M740 800 L860 555" marker-end="url(#arrowGray)"/>
  <text class="tiny" x="760" y="705">local code tables</text>

  <path class="wireData" d="M900 930 L900 615" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="914" y="740">external data</text>

  <path class="wireData" d="M1025 615 L1025 930" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="1038" y="773">read addr/index</text>

  <path class="wireData" d="M1185 510 L1235 510" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="1194" y="494">codebook</text>

  <path class="wireData" d="M1500 443 L1600 443" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="1510" y="428">stream data/len/valid/last</text>

  <path class="wireStatus" d="M1600 245 L1500 505" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="1528" y="320">stream_ready</text>

  <path class="wireData" d="M1720 522 L1868 522 L1868 881 L1840 881" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="1782" y="545">to packer</text>

  <!-- Status -->
  <path class="wireStatus" d="M690 325 L1555 325 L1555 690 L1600 690" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="1240" y="313">busy / done / error / fsm_state</text>

  <!-- Emit internal lines -->
  <path class="wire" d="M1320 556 L1320 586" marker-end="url(#arrowBlack)"/>
  <path class="wire" d="M1432 556 L1432 586" marker-end="url(#arrowBlack)"/>
</svg>
