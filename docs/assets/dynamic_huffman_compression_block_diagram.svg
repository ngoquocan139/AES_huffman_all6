<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320">
  <defs>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 32px Arial, sans-serif; fill: #111111; }
      .subtitle { font: 16px Arial, sans-serif; fill: #444444; }
      .stage1 { fill: #edf7f1; stroke: #2d6b3f; stroke-width: 2.2; }
      .stage2 { fill: #fff7e8; stroke: #8a5a00; stroke-width: 2.2; }
      .stage3 { fill: #eef5ff; stroke: #1f4f82; stroke-width: 2.2; }
      .io { fill: #f7f8fa; stroke: #9aa0a6; stroke-width: 1.7; }
      .box { fill: #ffffff; stroke: #202124; stroke-width: 2; }
      .subbox { fill: #fbfbfb; stroke: #444444; stroke-width: 1.7; }
      .dashed { fill: none; stroke: #666666; stroke-width: 2; stroke-dasharray: 9 7; }
      .stageTitle { font: 700 20px Arial, sans-serif; fill: #111111; }
      .stageSub { font: 700 15px Arial, sans-serif; fill: #333333; }
      .blockTitle { font: 700 17px Arial, sans-serif; fill: #111111; }
      .text { font: 14px Arial, sans-serif; fill: #222222; }
      .small { font: 13px Arial, sans-serif; fill: #333333; }
      .tiny { font: 12px Arial, sans-serif; fill: #444444; }
      .note { font: italic 13px Arial, sans-serif; fill: #555555; }
      .green { stroke: #2d6b3f; stroke-width: 3.2; fill: none; }
      .amber { stroke: #8a5a00; stroke-width: 3.2; fill: none; }
      .blue { stroke: #1f4f82; stroke-width: 3.2; fill: none; }
      .gray { stroke: #555555; stroke-width: 2.4; fill: none; }
      .thin { stroke: #333333; stroke-width: 2; fill: none; }
      .divider { stroke: #c7cbd1; stroke-width: 1.2; }
    </style>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d6b3f"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4f82"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="2200" height="1320"/>
  <text class="title" x="70" y="58">Whole-file Dynamic Huffman Compression Architecture</text>
  <text class="subtitle" x="70" y="88">Block diagram aligned with Sections 3.4.2.1, 3.4.2.2, 3.4.2.3 and the Huffman stream interface in Fig. 3.9</text>

  <!-- External input/control panels -->
  <rect class="io" x="70" y="155" width="250" height="155" rx="8"/>
  <text class="blockTitle" x="92" y="188">Control Inputs</text>
  <text class="small" x="92" y="220">clk, rst_n</text>
  <text class="small" x="92" y="242">start_block</text>
  <text class="small" x="92" y="264">whole_file_enable</text>
  <text class="small" x="92" y="286">whole_file_table_valid</text>

  <rect class="io" x="70" y="610" width="250" height="100" rx="8"/>
  <text class="blockTitle" x="92" y="643">Control FSM Role</text>
  <text class="small" x="92" y="673">schedules count/build</text>
  <text class="small" x="92" y="695">then starts emit</text>

  <rect class="io" x="70" y="360" width="250" height="185" rx="8"/>
  <text class="blockTitle" x="92" y="413">Whole-file Payload</text>
  <text class="small" x="92" y="445">byte_in[7:0]</text>
  <text class="small" x="92" y="467">byte_valid</text>
  <text class="small" x="92" y="489">block_start / block_end</text>
  <line class="divider" x1="92" y1="510" x2="295" y2="510"/>
  <text class="small" x="92" y="535">byte_ready</text>

  <!-- Stage 1 -->
  <rect class="stage1" x="380" y="140" width="530" height="650" rx="14"/>
  <text class="stageTitle" x="410" y="180">3.4.2.1 Input Collection, Frequency Counting,</text>
  <text class="stageTitle" x="410" y="206">and Code-Length Derivation</text>
  <text class="stageSub" x="410" y="235">Fig. 3.8b stage</text>

  <rect class="box" x="430" y="300" width="190" height="105" rx="8"/>
  <text class="blockTitle" x="470" y="337">input_collect_unit</text>
  <text class="text" x="458" y="366">captures valid bytes</text>
  <text class="text" x="458" y="388">and block boundary</text>

  <rect class="subbox" x="430" y="480" width="190" height="90" rx="8"/>
  <text class="blockTitle" x="478" y="516">block_buffer</text>
  <text class="text" x="468" y="544">current payload bytes</text>

  <rect class="box" x="675" y="300" width="175" height="105" rx="8"/>
  <text class="blockTitle" x="704" y="337">frequency_counter</text>
  <text class="text" x="708" y="366">histogram[0..255]</text>
  <text class="text" x="720" y="388">symbol counts</text>

  <rect class="box" x="575" y="630" width="250" height="105" rx="8"/>
  <text class="blockTitle" x="642" y="667">huffman_builder</text>
  <text class="text" x="612" y="696">tree construction</text>
  <text class="text" x="612" y="718">active-symbol code lengths</text>

  <!-- Stage 2 -->
  <rect class="stage2" x="970" y="140" width="520" height="650" rx="14"/>
  <text class="stageTitle" x="1000" y="180">3.4.2.2 Canonical Code Generation</text>
  <text class="stageTitle" x="1000" y="206">and Canonical Codebook Construction</text>
  <text class="stageSub" x="1000" y="235">Fig. 3.8c stage</text>

  <rect class="box" x="1030" y="320" width="215" height="115" rx="8"/>
  <text class="blockTitle" x="1065" y="358">canonical_code_generator</text>
  <text class="text" x="1062" y="388">sorts by code length</text>
  <text class="text" x="1062" y="410">then by symbol index</text>

  <rect class="box" x="1285" y="300" width="155" height="75" rx="8"/>
  <text class="blockTitle" x="1315" y="333">symbol table</text>
  <text class="tiny" x="1312" y="355">external_symbol_*</text>

  <rect class="box" x="1285" y="410" width="155" height="75" rx="8"/>
  <text class="blockTitle" x="1308" y="443">code length table</text>
  <text class="tiny" x="1305" y="465">external_code_len_*</text>

  <rect class="box" x="1285" y="520" width="155" height="75" rx="8"/>
  <text class="blockTitle" x="1325" y="553">code table</text>
  <text class="tiny" x="1318" y="575">external_code_*</text>

  <rect class="subbox" x="1040" y="615" width="405" height="90" rx="8"/>
  <text class="blockTitle" x="1132" y="650">External Codebook Read Interface</text>
  <text class="text" x="1072" y="678">symbol_read_addr, code_len_read_index, code_read_index</text>

  <!-- Stage 3 -->
  <rect class="stage3" x="1550" y="140" width="570" height="650" rx="14"/>
  <text class="stageTitle" x="1580" y="180">3.4.2.3 Payload Encoding, Header Formatting,</text>
  <text class="stageTitle" x="1580" y="206">and Output Packing</text>
  <text class="stageSub" x="1580" y="235">Fig. 3.8d stage and Fig. 3.9 interface</text>

  <rect class="box" x="1610" y="292" width="240" height="300" rx="10"/>
  <text class="blockTitle" x="1675" y="330">emit_backend</text>
  <rect class="subbox" x="1640" y="365" width="180" height="58" rx="6"/>
  <text class="text" x="1680" y="399">header_formatter</text>
  <rect class="subbox" x="1640" y="448" width="180" height="58" rx="6"/>
  <text class="text" x="1685" y="482">payload_emitter</text>
  <rect class="subbox" x="1640" y="531" width="180" height="58" rx="6"/>
  <text class="text" x="1678" y="557">stream_output</text>
  <text class="tiny" x="1698" y="576">interface</text>

  <rect class="io" x="1890" y="300" width="180" height="170" rx="8"/>
  <text class="blockTitle" x="1932" y="333">Fig. 3.9</text>
  <text class="text" x="1914" y="361">stream_data[31:0]</text>
  <text class="text" x="1914" y="385">stream_len</text>
  <text class="text" x="1914" y="409">stream_valid</text>
  <text class="text" x="1914" y="433">stream_last</text>
  <line class="divider" x1="1914" y1="448" x2="2048" y2="448"/>
  <text class="text" x="1914" y="465">stream_ready</text>

  <rect class="box" x="1890" y="540" width="180" height="95" rx="8"/>
  <text class="blockTitle" x="1930" y="578">bit_packer_128</text>
  <text class="text" x="1920" y="606">variable bits to</text>
  <text class="text" x="1920" y="628">128-bit blocks</text>

  <rect class="box" x="1890" y="690" width="180" height="70" rx="8"/>
  <text class="blockTitle" x="1920" y="733">AES-128-CBC</text>

  <!-- Optional status panel -->
  <rect class="io" x="1550" y="850" width="570" height="105" rx="8"/>
  <text class="blockTitle" x="1580" y="885">Status / Debug Outputs</text>
  <text class="small" x="1580" y="915">busy, done, error_flag, selected_mode_out[1:0], fsm_state[3:0]</text>
  <text class="small" x="1580" y="938">These signals describe the encoder phase and error state; they are not payload data.</text>

  <!-- Main buses -->
  <path class="green" d="M320 470 H430" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="338" y="458">byte stream</text>
  <path class="thin" d="M430 535 H320" marker-end="url(#arrowBlack)"/>
  <text class="tiny" x="344" y="523">byte_ready</text>

  <path class="green" d="M620 352 H675" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="626" y="339">valid byte</text>
  <path class="green" d="M525 405 V480" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="540" y="450">payload bytes</text>
  <path class="green" d="M762 405 V630" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="776" y="520">symbol counts</text>

  <path class="amber" d="M825 682 H1030 V378" marker-end="url(#arrowAmber)"/>
  <text class="tiny" x="880" y="670">code length table</text>
  <path class="amber" d="M1245 378 H1285" marker-end="url(#arrowAmber)"/>
  <path class="amber" d="M1245 420 H1285 V448" marker-end="url(#arrowAmber)"/>
  <path class="amber" d="M1245 462 H1285 V558" marker-end="url(#arrowAmber)"/>
  <text class="tiny" x="1254" y="365">canonical entries</text>

  <path class="amber" d="M1440 338 H1610 V405" marker-end="url(#arrowAmber)"/>
  <path class="amber" d="M1440 448 H1610 V478" marker-end="url(#arrowAmber)"/>
  <path class="amber" d="M1440 558 H1610 V478" marker-end="url(#arrowAmber)"/>
  <text class="tiny" x="1460" y="318">external canonical codebook ports</text>

  <path class="green" d="M620 525 H1530 V478 H1610" marker-end="url(#arrowGreen)"/>
  <text class="tiny" x="940" y="512">buffered payload bytes</text>

  <path class="blue" d="M1850 448 H1890" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="1845" y="435">stream chunks</text>
  <path class="blue" d="M2070 588 H2110 V725 H2070" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="2060" y="665">128-bit transport blocks</text>

  <!-- Boundary hints -->
  <rect class="dashed" x="405" y="260" width="495" height="500" rx="12"/>
  <text class="tiny" x="425" y="748">count/build logic in the TX whole-file path</text>

  <rect class="dashed" x="1585" y="260" width="300" height="365" rx="12"/>
  <text class="tiny" x="1605" y="618">dynamic_huffman_encoder emit path</text>

  <!-- Bottom summary -->
  <rect class="io" x="380" y="1035" width="1740" height="130" rx="8"/>
  <text class="blockTitle" x="410" y="1070">How this figure links to the thesis text</text>
  <text class="small" x="410" y="1100">Section 3.4.2.1 corresponds to the green stage: byte collection, histogram update, Huffman tree construction, and code-length derivation.</text>
  <text class="small" x="410" y="1125">Section 3.4.2.2 corresponds to the amber stage: canonical code assignment and storage into the external symbol, code-length, and code tables.</text>
  <text class="small" x="410" y="1150">Section 3.4.2.3 corresponds to the blue stage: payload bytes are encoded using the canonical codebook, emitted through Fig. 3.9 stream signals, packed to 128-bit blocks, and forwarded to AES-128-CBC.</text>
</svg>
