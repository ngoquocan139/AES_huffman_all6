<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 42px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475467; }
      .addr { font: 700 18px Consolas, monospace; fill: #344054; }
      .label { font: 700 22px Arial, sans-serif; fill: #101828; }
      .note { font: 400 17px Arial, sans-serif; fill: #475467; }
      .tag { font: 700 16px Arial, sans-serif; fill: #7a2e0e; }
      .small { font: 400 15px Arial, sans-serif; fill: #475467; }
      .axis { stroke: #101828; stroke-width: 3; fill: none; }
      .row { stroke: #101828; stroke-width: 1.6; rx: 10; ry: 10; }
      .safe { fill: #e9eef5; }
      .zero { fill: #fff1e7; }
      .cipher { fill: #ffe3d6; }
      .outline-zero { fill: none; stroke: #f97316; stroke-width: 5; stroke-dasharray: 14 10; rx: 16; ry: 16; }
      .callout { fill: #ffffff; stroke: #98a2b3; stroke-width: 2; rx: 12; ry: 12; }
      .callout-title { font: 700 22px Arial, sans-serif; fill: #c2410c; }
      .callout-text { font: 400 17px Arial, sans-serif; fill: #344054; }
      .legend { font: 700 17px Arial, sans-serif; fill: #344054; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="1600"/>

  <text class="title" x="600" y="62" text-anchor="middle">DMEM 32 KiB Partition</text>
  <text class="subtitle" x="600" y="100" text-anchor="middle">Address range: 0x0000_0000 .. 0x0000_7FFF, byte addressed</text>

  <rect class="safe" x="230" y="128" width="32" height="20"/>
  <text class="legend" x="272" y="145">Not zeroized by board button</text>
  <rect class="zero" x="545" y="128" width="32" height="20" stroke="#f97316" stroke-width="1.5"/>
  <text class="legend" x="587" y="145">Zeroized by btn_zeroize_i</text>
  <rect class="cipher" x="835" y="128" width="32" height="20" stroke="#c2410c" stroke-width="1.5"/>
  <text class="legend" x="877" y="145">Encrypted storage slots</text>

  <line class="axis" x1="96" y1="178" x2="96" y2="1490"/>
  <line class="axis" x1="96" y1="178" x2="145" y2="178"/>
  <line class="axis" x1="96" y1="1490" x2="145" y2="1490"/>
  <text class="addr" x="44" y="184">0x0000</text>
  <text class="addr" x="44" y="1496">0x7FFF</text>

  <!-- Not zeroized region -->
  <rect class="row safe" x="160" y="170" width="720" height="72"/>
  <text class="addr" x="184" y="198">0x0000_0000 .. 0x0000_003F</text>
  <text class="label" x="184" y="225">RESULT_WORD[0..15]</text>
  <text class="note" x="430" y="225">firmware/testbench result words</text>

  <rect class="row safe" x="160" y="252" width="720" height="72"/>
  <text class="addr" x="184" y="280">0x0000_0040 .. 0x0000_005B</text>
  <text class="label" x="184" y="307">Input length + board control</text>
  <text class="note" x="500" y="307">length, status, selected file ID, event</text>

  <rect class="row safe" x="160" y="334" width="720" height="72"/>
  <text class="addr" x="184" y="362">0x0000_005C .. 0x0000_00FF</text>
  <text class="label" x="184" y="389">Reserved low gap</text>
  <text class="note" x="405" y="389">kept outside board zeroize range</text>

  <text class="tag" x="902" y="292">NOT ZEROIZED</text>

  <!-- Zeroized secure range outline -->
  <rect class="outline-zero" x="142" y="438" width="770" height="990"/>
  <text class="callout-title" x="535" y="428" text-anchor="middle">ZEROIZE RANGE: 0x0000_0100 .. 0x0000_7FFF</text>

  <rect class="row zero" x="160" y="456" width="720" height="86"/>
  <text class="addr" x="184" y="484">0x0000_0100 .. 0x0000_01FF</text>
  <text class="label" x="184" y="512">Secure metadata + IV counter</text>
  <text class="note" x="184" y="534">slots 0..2, metadata flags, IV/version counter</text>
  <text class="tag" x="775" y="514">ZEROIZED</text>

  <rect class="row zero" x="160" y="554" width="720" height="78"/>
  <text class="addr" x="184" y="582">0x0000_0200 .. 0x0000_031F</text>
  <text class="label" x="184" y="610">Snapshot + report area</text>
  <text class="note" x="448" y="610">runtime result copies and report words</text>
  <text class="tag" x="775" y="611">ZEROIZED</text>

  <rect class="row zero" x="160" y="644" width="720" height="86"/>
  <text class="addr" x="184" y="672">0x0000_0320 .. 0x0000_1FFF</text>
  <text class="label" x="184" y="700">Scratch + UART bundle window</text>
  <text class="note" x="184" y="722">loader bundle header and staged payload area</text>
  <text class="tag" x="775" y="702">ZEROIZED</text>

  <rect class="row zero" x="160" y="742" width="720" height="98"/>
  <text class="addr" x="184" y="770">0x0000_2000 .. 0x0000_3FFF</text>
  <text class="label" x="184" y="798">Plaintext source regions</text>
  <text class="note" x="184" y="820">INPUT1_SRC_ADDR 0x2000..0x2FFF, INPUT2_SRC_ADDR 0x3000..0x3FFF</text>
  <text class="tag" x="775" y="800">ZEROIZED</text>

  <rect class="row cipher" x="160" y="852" width="720" height="112"/>
  <text class="addr" x="184" y="880">0x0000_4000 .. 0x0000_5DFF</text>
  <text class="label" x="184" y="908">Ciphertext slots 0..2</text>
  <text class="note" x="184" y="930">encrypted secure-storage output, 0x0A00 bytes per slot</text>
  <text class="note" x="184" y="952">slot0: 0x4000, slot1: 0x4A00, slot2: 0x5400</text>
  <text class="tag" x="775" y="910">ZEROIZED</text>

  <rect class="row zero" x="160" y="976" width="720" height="74"/>
  <text class="addr" x="184" y="1004">0x0000_5E00 .. 0x0000_5FFF</text>
  <text class="label" x="184" y="1031">Reserved RX gap</text>
  <text class="tag" x="775" y="1031">ZEROIZED</text>

  <rect class="row zero" x="160" y="1062" width="720" height="98"/>
  <text class="addr" x="184" y="1090">0x0000_6000 .. 0x0000_7EFF</text>
  <text class="label" x="184" y="1118">Selected RX output region</text>
  <text class="note" x="184" y="1140">restored plaintext output / RX scratch</text>
  <text class="tag" x="775" y="1120">ZEROIZED</text>

  <rect class="row zero" x="160" y="1172" width="720" height="76"/>
  <text class="addr" x="184" y="1200">0x0000_7F00 .. 0x0000_7FFF</text>
  <text class="label" x="184" y="1227">CPU stack top area</text>
  <text class="tag" x="775" y="1228">ZEROIZED</text>

  <!-- Zeroize annotation -->
  <rect class="callout" x="930" y="456" width="224" height="316"/>
  <text class="callout-title" x="948" y="494">Board zeroize</text>
  <text class="callout-text" x="948" y="530">btn_zeroize_i / SW18</text>
  <text class="callout-text" x="948" y="562">writes 0 to every</text>
  <text class="callout-text" x="948" y="586">32-bit word from</text>
  <text class="callout-text" x="948" y="610">0x0100 to 0x7FFF.</text>
  <text class="callout-text" x="948" y="650">SoC is held in reset</text>
  <text class="callout-text" x="948" y="674">during clearing.</text>
  <text class="callout-text" x="948" y="714">Run latch is dropped</text>
  <text class="callout-text" x="948" y="738">after erase.</text>

  <path d="M930 616 C905 616 905 520 884 520" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="callout" x="930" y="820" width="224" height="218"/>
  <text class="callout-title" x="948" y="858">Firmware zeroize</text>
  <text class="callout-text" x="948" y="894">Optional build flags:</text>
  <text class="small" x="948" y="926">TX source after write</text>
  <text class="small" x="948" y="954">RX output after report</text>
  <text class="callout-text" x="948" y="994">Used when demo needs</text>
  <text class="callout-text" x="948" y="1018">plaintext cleanup.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>

  <text class="subtitle" x="600" y="1535" text-anchor="middle">Zeroize limits exposure if DMEM is read after use; AES key is still a fixed RTL parameter in the current prototype.</text>
</svg>
